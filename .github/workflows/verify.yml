name: Verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Codegen tools are pinned to the versions that produced the committed gen/, so this
      # check only fails when the PR itself makes gen/ stale. The remote Python plugins are
      # pinned in buf.gen.yaml. To upgrade: bump the pins and commit the regenerated gen/.
      - name: Install buf
        run: |
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.70.0/buf-Linux-x86_64 -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Lint
        run: buf lint

      - name: Check for breaking changes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found, skipping breaking change check."
            exit 0
          fi
          # A breaking change is allowed only when VERSION declares one relative to the last
          # release: a major bump, or a minor bump while the major version is 0.
          IFS=. read -r prev_major prev_minor _ <<< "${PREV_TAG#v}"
          IFS=. read -r major minor _ < VERSION
          if [ "$major" -gt "$prev_major" ] || { [ "$major" -eq 0 ] && [ "$prev_major" -eq 0 ] && [ "$minor" -gt "$prev_minor" ]; }; then
            echo "VERSION $(cat VERSION) declares a breaking release over $PREV_TAG. Reporting breaking changes without failing:"
            buf breaking --against ".git#tag=$PREV_TAG" || true
            exit 0
          fi
          echo "Checking breaking changes against $PREV_TAG"
          buf breaking --against ".git#tag=$PREV_TAG"

      - name: Regenerate
        run: make generate

      - name: Ensure committed generated code is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'make generate' and commit the result." >&2
            exit 1
          fi

      - name: Go module builds
        run: cd gen/go && go build ./...

      - name: Python package installs and imports
        run: |
          pip install ./gen/python
          python -c "from reggie_proto import workers_pb2, workers_pb2_grpc"
