[project]
name = "reggie-proto"
version = "0.3.0"
description = "Generated Python gRPC/protobuf stubs for the Reggie ML workers."
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.31.0",
    "grpcio>=1.78.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reggie_proto"]
