version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v35.0
    out: gen/python/reggie_proto
  - remote: buf.build/grpc/python:v1.78.0
    out: gen/python/reggie_proto
  - remote: buf.build/protocolbuffers/pyi:v35.0
    out: gen/python/reggie_proto
